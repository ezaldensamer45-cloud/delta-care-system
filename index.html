<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Delta Care</title>

<style>
body{background:#0f172a;color:white;font-family:Arial;padding:20px}
input,button{padding:10px;margin:5px;border-radius:6px;border:none}
button{background:#22c55e;color:white}
.card{background:#1e293b;padding:10px;margin:10px 0;border-radius:8px}
.details{display:none}
</style>

</head>
<body>

<h2>Delta Care</h2>

<input id="search" placeholder="بحث" oninput="loadPatients()">

<h3>إضافة مريض</h3>

<input id="name" placeholder="اسم">
<input id="age" placeholder="عمر">
<input id="doctor" placeholder="طبيب">

<input id="disease" placeholder="مرض">
<input id="place" placeholder="مكان">

<input id="date" type="date">
<input id="price" placeholder="سعر">

<input id="materials" placeholder="مواد">
<input id="notes" placeholder="ملاحظات">

<input type="file" id="images" multiple>

<button onclick="addPatient()">➕ إضافة</button>

<hr>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCh9CvocS2Ml7Pwowde8SFLwI0dbITLt5E",
authDomain: "delta-care-ff9e4.firebaseapp.com",
projectId: "delta-care-ff9e4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ADD
window.addPatient = async function(){

let name = nameInput.value;
if(!name){alert("اكتب اسم");return;}

await addDoc(collection(db,"patients"),{
name,
age:age.value
});

alert("تمت الإضافة");

loadPatients();
}

// LOAD
window.loadPatients = async function(){

let list = document.getElementById("list");
list.innerHTML = "";

let snap = await getDocs(collection(db,"patients"));

snap.forEach(d=>{
let p = d.data();

list.innerHTML += `
<div class="card">
${p.name} - ${p.age}
</div>
`;
});
}

loadPatients();

</script>

</body>
</html>
