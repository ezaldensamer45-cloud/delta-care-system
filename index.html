<script>

let patients = JSON.parse(localStorage.getItem("patients")) || [];

// ================= ADD =================
function addPatient(){

let name = document.getElementById("name").value.trim();

if(name === ""){
alert("اكتب الاسم");
return;
}

let p = {
name: name,
age: age.value,
doctor: doctor.value,
disease: disease.value,
place: place.value,
date: date.value,
price: price.value,
materials: materials.value,
notes: notes.value,
images: [],
sessions: []
};

let files = images.files;

if(files.length === 0){
save(p);
return;
}

let count = 0;

for(let f of files){

let reader = new FileReader();

reader.onload = function(e){
p.images.push(e.target.result);
count++;

if(count === files.length){
save(p);
}
};

reader.readAsDataURL(f);
}

}

// ================= SAVE =================
function save(p){
patients.push(p);
localStorage.setItem("patients", JSON.stringify(patients));
display();
alert("تم الحفظ ✅");
}

// ================= DISPLAY =================
function display(){

let s = search.value.toLowerCase().trim();
list.innerHTML = "";

patients
.filter(p => (p.name||"").toLowerCase().includes(s))
.forEach((p,i)=>{

list.innerHTML += `
<div class="card">

<h3 onclick="toggle(${i})" style="cursor:pointer">
▶ ${p.name}
</h3>

<div id="details-${i}" style="display:none">

<p>Age: ${p.age || "-"}</p>
<p>Doctor: ${p.doctor || "-"}</p>
<p>Disease: ${p.disease || "-"}</p>
<p>Location: ${p.place || "-"}</p>
<p>Date: ${p.date || "-"}</p>
<p>Session: ${p.price || "-"}</p>
<p>Materials: ${p.materials || "-"}</p>
<p>Notes: ${p.notes || "-"}</p>

<!-- 📸 صور -->
${(p.images||[]).map(img=>`
<img src="${img}" width="100" style="cursor:pointer" onclick="openImage('${img}')">
`).join("")}

<hr>

<button onclick="editPatient(${i})">✏️ تعديل</button>
<button onclick="addSession(${i})">➕ جلسة</button>
<button onclick="deletePatient(${i})">🗑 حذف</button>

<!-- 🧾 الجلسات -->
<div>
${(p.sessions||[]).map(s=>`
<div style="background:#0f172a;padding:5px;margin:5px 0;border-radius:6px">
📅 ${s.date} - 💰 ${s.price}
<br>
${(s.images||[]).map(img=>`
<img src="${img}" width="80" onclick="openImage('${img}')">
`).join("")}
</div>
`).join("")}
</div>

</div>
</div>
`;
});

}

// ================= TOGGLE =================
function toggle(i){
let el = document.getElementById("details-"+i);
el.style.display = el.style.display==="block"?"none":"block";
}

// ================= IMAGE VIEW =================
function openImage(src){
let w = window.open("");
w.document.write(`<img src="${src}" style="width:100%">`);
}

// ================= DELETE =================
function deletePatient(i){
if(confirm("حذف؟")){
patients.splice(i,1);
localStorage.setItem("patients", JSON.stringify(patients));
display();
}
}

// ================= EDIT =================
function editPatient(i){

let p = patients[i];

p.name = prompt("الاسم", p.name) || p.name;
p.age = prompt("العمر", p.age) || p.age;
p.doctor = prompt("الطبيب", p.doctor) || p.doctor;
p.disease = prompt("المرض", p.disease) || p.disease;
p.place = prompt("المكان", p.place) || p.place;
p.price = prompt("السعر", p.price) || p.price;

localStorage.setItem("patients", JSON.stringify(patients));
display();
}

// ================= SESSION =================
function addSession(i){

let date = prompt("تاريخ الجلسة");
let price = prompt("السعر");

let input = document.createElement("input");
input.type="file";
input.multiple=true;

input.onchange = function(){

let files = input.files;
let imgs=[];
let count=0;

for(let f of files){

let reader = new FileReader();

reader.onload = function(e){
imgs.push(e.target.result);
count++;

if(count === files.length){

if(!patients[i].sessions) patients[i].sessions = [];

patients[i].sessions.push({
date,price,images:imgs
});

localStorage.setItem("patients", JSON.stringify(patients));
display();
}

};

reader.readAsDataURL(f);
}

};

input.click();
}

// تشغيل
display();

</script>
