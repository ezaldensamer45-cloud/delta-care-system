<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Delta Care Final</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px}
input,button{padding:10px;margin:5px;border-radius:6px;border:none}
button{background:#22c55e;color:white;cursor:pointer}
.card{background:#1e293b;padding:10px;margin:10px 0;border-radius:8px}
.details{display:none;margin-top:10px}
img{width:70px;margin:3px;border-radius:5px;cursor:pointer}
.title{display:flex;justify-content:space-between;cursor:pointer}
.arrow{font-size:18px}
</style>

</head>
<body>

<h2>Delta Care Final</h2>

<input id="search" placeholder="بحث" oninput="loadPatients()">

<h3>إضافة مريض</h3>

<input id="name" placeholder="اسم المريض">
<input id="age" placeholder="العمر">
<input id="doctor" placeholder="الطبيب">

<input id="disease" placeholder="نوع المرض">
<input id="place" placeholder="مكان المرض">

<input id="date" type="date">
<input id="price" placeholder="سعر الجلسة">

<input id="materials" placeholder="المواد المستخدمة">
<input id="notes" placeholder="ملاحظات">

<br>
<input type="file" id="images" multiple>
<br>

<button onclick="addPatient()">➕ إضافة</button>

<hr>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCh9CvocS2Ml7Pwowde8SFLwI0dbITLt5E",
  authDomain: "delta-care-ff9e4.firebaseapp.com",
  projectId: "delta-care-ff9e4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= ADD =================
window.addPatient = function(){

let name = document.getElementById("name").value;
if(!name){
alert("اكتب اسم المريض");
return;
}

let data = {
name,
age: age.value,
doctor: doctor.value,
disease: disease.value,
place: place.value,
date: date.value,
price: price.value,
materials: materials.value,
notes: notes.value,
images: [],
sessions: []
};

let files = images.files;

if(files.length > 0){
let count = 0;

for(let f of files){
let reader = new FileReader();

reader.onload = function(e){
data.images.push(e.target.result);
count++;

if(count === files.length){
save();
}
};

reader.readAsDataURL(f);
}
}else{
save();
}

async function save(){
await addDoc(collection(db,"patients"), data);
alert("تمت الإضافة ✅");
loadPatients();
}
}

// ================= LOAD =================
window.loadPatients = async function(){

let list = document.getElementById("list");
let search = document.getElementById("search").value.toLowerCase();

list.innerHTML = "";

let snap = await getDocs(collection(db,"patients"));

snap.forEach(docSnap=>{

let p = docSnap.data();
let id = docSnap.id;

if(!p.name.toLowerCase().includes(search)) return;

list.innerHTML += `
<div class="card">

<div class="title" onclick="toggle('${id}')">
<span>${p.name}</span>
<span class="arrow" id="a${id}">⬇</span>
</div>

<div class="details" id="${id}">

<p>👤 ${p.age}</p>
<p>🩺 ${p.doctor}</p>
<p>🦠 ${p.disease}</p>
<p>📍 ${p.place}</p>
<p>📅 ${p.date}</p>
<p>💰 ${p.price}</p>
<p>🧪 ${p.materials}</p>
<p>📝 ${p.notes}</p>

${(p.images||[]).map(i=>`<img src="${i}" onclick="openImage('${i}')">`).join("")}

<br>

<button onclick="deletePatient('${id}')">🗑 حذف</button>
<button onclick="editPatient('${id}')">✏ تعديل</button>
<button onclick="addSession('${id}')">➕ جلسة</button>
<button onclick="printPatient('${id}')">🖨 طباعة</button>

<div>
${(p.sessions||[]).map(s=>`<div>📅 ${s.date} - 💰 ${s.price}</div>`).join("")}
</div>

</div>

</div>
`;

});
}

// ================= TOGGLE =================
window.toggle = function(id){
let el = document.getElementById(id);
let arrow = document.getElementById("a"+id);

if(el.style.display==="block"){
el.style.display="none";
arrow.innerText="⬇";
}else{
el.style.display="block";
arrow.innerText="⬆";
}
}

// ================= DELETE =================
window.deletePatient = async function(id){
await deleteDoc(doc(db,"patients",id));
loadPatients();
}

// ================= EDIT =================
window.editPatient = async function(id){
let name = prompt("اسم جديد");
let age = prompt("عمر جديد");

await updateDoc(doc(db,"patients",id),{name,age});
loadPatients();
}

// ================= SESSION =================
window.addSession = async function(id){

let date = prompt("تاريخ");
let price = prompt("سعر");

let snap = await getDocs(collection(db,"patients"));
let p;

snap.forEach(d=>{
if(d.id===id) p=d.data();
});

let sessions = p.sessions || [];
sessions.push({date,price});

await updateDoc(doc(db,"patients",id),{sessions});
loadPatients();
}

// ================= PRINT =================
window.printPatient = function(id){
let content = document.getElementById(id).innerHTML;
let w = window.open("");
w.document.write(content);
w.print();
}

// ================= IMAGE =================
window.openImage = function(src){
let w = window.open("");
w.document.write(`<img src="${src}" style="width:100%">`);
}

// 🔥 أهم سطر
loadPatients();

</script>

</body>
</html>
